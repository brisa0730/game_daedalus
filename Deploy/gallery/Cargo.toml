[package]
name = "gallery"
version = "0.1.0"
edition = "2024"
publish = false
description = "The daedalus class gallery server (suwon.orcarin.com)"

[dependencies]
axum = "0.8"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
subtle = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "fs", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
maud = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
http-body-util = "0.1.5"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"
